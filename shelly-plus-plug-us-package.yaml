          id(peak_voltage_v) = 0.0f;
          id(minimum_voltage_v) = 0.0f;
          id(peak_internal_temperature_c) = 0.0f;
          id(peak_power).publish_state(0.0f);
          id(peak_current).publish_state(0.0f);
          id(peak_voltage).publish_state(0.0f);
          id(minimum_voltage).publish_state(0.0f);
