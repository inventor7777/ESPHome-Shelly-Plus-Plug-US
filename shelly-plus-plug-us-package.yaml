interval:
  - interval: 1min
    then:
      - if:
          condition:
            lambda: return id(relay_on_timer_active);
          then:
            - lambda: |-
                id(lifetime_relay_on_seconds) += (millis() - id(relay_on_started_ms)) / 1000;
                id(relay_on_started_ms) = millis();
                id(lifetime_relay_on_time).publish_state(id(lifetime_relay_on_seconds) / 3600.0);
